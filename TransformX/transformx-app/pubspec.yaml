name: transformx_app
description: TransformX - Premium Body Transformation Ecosystem
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Navigation
  go_router: ^11.0.0

  # HTTP & API
  dio: ^5.3.0
  http: ^1.1.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_storage: ^2.1.1
  shared_preferences: ^2.2.1

  # Firebase
  firebase_core: ^2.20.0
  firebase_storage: ^11.2.0
  firebase_messaging: ^14.6.0
  firebase_analytics: ^10.6.0

  # Ads
  google_mobile_ads: ^3.0.0

  # In-App Purchases / Subscriptions
  in_app_purchase: ^3.1.0
  purchases_flutter: ^6.0.0

  # UI & Design
  flutter_svg: ^2.0.7
  lottie: ^2.4.0
  fl_chart: ^0.63.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Authentication
  google_sign_in: ^6.1.0
  firebase_auth: ^4.10.0

  # Image Handling
  image_picker: ^1.0.0
  image_compression: ^2.0.0

  # Notifications
  flutter_local_notifications: ^14.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  logger: ^2.0.0
  connectivity_plus: ^5.0.0
  device_info_plus: ^9.0.0

  # Date & Time
  table_calendar: ^3.0.9

  # Charts & Graphs
  syncfusion_flutter_charts: ^23.1.36

  # Error Handling
  sentry_flutter: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
